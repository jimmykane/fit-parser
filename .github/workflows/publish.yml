name: Publish npm package

# A workflow_run is deliberately used instead of a second push trigger: publishing
# begins only after CI has succeeded for the exact commit that landed on main.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      force_publish:
        description: Publish this main commit even when its version matches its parent
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  detect-release:
    # CI also runs for pull requests, but only successful push runs may release.
    # Manual dispatch is restricted to main for an intentionally retried release.
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push') ||
      (github.event_name == 'workflow_dispatch' &&
       github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.release.outputs.publish }}
      version: ${{ steps.release.outputs.version }}

    steps:
      - uses: actions/checkout@v6
        with:
          # Do not publish whatever happens to be at main when this starts.
          # Publish the precise commit whose CI run completed successfully, or
          # the manually selected main commit.
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2

      - id: release
        name: Detect a publishable version
        env:
          TARGET_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          FORCE_PUBLISH: ${{ inputs.force_publish || 'false' }}
        run: |
          version="$(node -p "require('./package.json').version")"
          node <<'NODE'
          const packageJson = require('./package.json');
          const lockfile = require('./package-lock.json');

          if (
            packageJson.version !== lockfile.version ||
            packageJson.version !== lockfile.packages[''].version
          ) {
            throw new Error('package.json and package-lock.json must have the same version');
          }
          NODE

          echo "version=$version" >> "$GITHUB_OUTPUT"

          if ! git cat-file -e "$TARGET_SHA^:package.json" 2> /dev/null; then
            echo "Unable to compare this commit with its parent package version" >&2
            exit 1
          fi

          previous_version="$(git show "$TARGET_SHA^:package.json" | node -e "let input=''; process.stdin.on('data', (chunk) => input += chunk); process.stdin.on('end', () => process.stdout.write(JSON.parse(input).version));")"

          if [ "$previous_version" = "$version" ] && [ "$FORCE_PUBLISH" != "true" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "publish=true" >> "$GITHUB_OUTPUT"

  publish:
    needs: detect-release
    if: needs.detect-release.outputs.publish == 'true' && vars.NPM_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - run: npm ci

      - name: Verify the publishable package
        run: |
          npm pack --dry-run --json > "$RUNNER_TEMP/npm-pack.json"
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';

          const [pack] = JSON.parse(readFileSync(process.env.RUNNER_TEMP + '/npm-pack.json', 'utf8'));
          const allowedRootFiles = new Set([
            'CHANGELOG.md',
            'CONTRIBUTORS.md',
            'LICENSE',
            'PROFILE.md',
            'README.md',
            'package.json',
          ]);
          const unexpected = pack.files
            .map(({ path }) => path)
            .filter((path) => !allowedRootFiles.has(path) && !path.startsWith('dist/'));
          const required = [
            'PROFILE.md',
            'dist/profile.js',
            'dist/cjs/profile.js',
          ];
          const packagedPaths = new Set(pack.files.map(({ path }) => path));
          const missing = required.filter((path) => !packagedPaths.has(path));
          const legacyProfileArtifacts = pack.files
            .map(({ path }) => path)
            .filter((path) => /(?:^|\/)garmin_profile\.generated\./.test(path));
          const tests = pack.files
            .map(({ path }) => path)
            .filter((path) => /(?:\.test|\.spec)\.(?:[cm]?[jt]sx?|d\.ts)$/.test(path));

          if (
            unexpected.length > 0 ||
            missing.length > 0 ||
            legacyProfileArtifacts.length > 0 ||
            tests.length > 0
          ) {
            throw new Error(`Invalid package files: ${[
              ...unexpected,
              ...missing.map((path) => `missing:${path}`),
              ...legacyProfileArtifacts,
              ...tests,
            ].join(', ')}`);
          }

          console.log(`Validated ${pack.entryCount} files (${pack.unpackedSize} bytes unpacked).`);
          NODE

      - name: Publish to npm
        env:
          VERSION: ${{ needs.detect-release.outputs.version }}
        run: |
          package_name="$(node -p "require('./package.json').name")"

          if npm view "$package_name@$VERSION" version > /dev/null 2>&1; then
            echo "Version $VERSION is already published." >&2
            exit 1
          fi

          npm publish

      - name: Tag the published release
        env:
          VERSION: ${{ needs.detect-release.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "Release v$VERSION"
          git push origin "v$VERSION"
